[project]
name = "supabase-health-inspector"
version = "3.0.0"
description = "Postgres & Supabase Diagnostic Inspector with read-only RLS policy inspection, Vacuum Wraparound Analysis, and Gemini Function-Calling Assistant"
readme = "README.md"
requires-python = ">=3.10"  # only a walrus operator is used; 3.10 is the floor
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.2",
    "pyjwt[crypto]>=2.9.0",
    "google-genai>=1.0.0",
    "apscheduler>=3.10.4",
    "pydantic-settings>=2.6.0",
    "pydantic>=2.9.2",
    "email-validator>=2.0.0"  # required by pydantic EmailStr in models.py
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
